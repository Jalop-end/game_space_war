apply plugin: 'application'

application {
    mainClass = 'com.spacewar.lwjgl3.Lwjgl3Launcher'
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

run {
    workingDir = rootProject.file('assets')
    ignoreExitValue = true
}

tasks.register('dist', Jar) {
    dependsOn ':core:classes'
    dependsOn ':core:jar'
    archiveFileName = 'SpaceWar.jar'
    destinationDirectory = file("$rootDir")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'com.spacewar.lwjgl3.Lwjgl3Launcher'
    }
    from files(sourceSets.main.output.classesDirs)
    from files(sourceSets.main.output.resourcesDir)
    from files(project(':core').sourceSets.main.output.classesDirs)
    from files(project(':core').sourceSets.main.output.resourcesDir)
    from {
        configurations.runtimeClasspath.collect {
            (it.isDirectory() || (it.name.endsWith('.jar') && !it.name.startsWith('core'))) ? (it.isDirectory() ? it : zipTree(it)) : null
        }
    }
    from files(rootProject.file('assets'))
}
